# ===========================================================================
# Fichier d'input de ./process
#   usage :  ./process Drift.cfg [cle=valeur ...]
#   les arguments cle=valeur surchargent le fichier (utile pour les balayages)
#   unites : cm, ns, electrons
# ===========================================================================

# --- Fichiers (obligatoires) ---
input_file  = ../../../simulation_output/T2F_G4_40mu.h5
output_file = ../drift_output/drift_pad5mm.h5

# --- Execution ---
n_events    = 100000        # 0 = tous les evenements du fichier d'entree
n_threads   = 8        # 1 pour des tirages reproductibles d'une version a l'autre
chunk_size  = 20000
base_seed   = 42
frag_mask   = 3        # 3 = H et L, 1 = H seul, 2 = L seul
step_size_target = 0.05   # pas de trace apres fusion (cm)

# --- Lecture (en electrons par bin, sur le signal vrai ; seule la polarite positive est lue) ---
# Preselection des pads : un pad est garde si un de ses bins depasse seuil_qt.
# Pour tout lire (controles de conservation) : seuil_qt = 0
# Pour comparer un run avec bruit et un run sans bruit : meme seuil_qt dans les deux.
seuil_qt     = 10
eps_qt       = 10

# --- Bruit electronique et lecture (voir noise.hpp, readout.hpp) ---
# noise_enable = 0 : meme chaine (reponse du preampli, CAN), sans bruit ni seuil de lecture
noise_enable      = 1
noise_model = capacitance         # cpacitance (chaque pad à sa capa définit dans fichier ou si fichier vide valeur global) ou uniform (un seul ENC).
# valeurs par défaut, à ne mettre que pour les changer :
# c_ref_pf = 93
# c_cable_pf = 93
# c_routing_pf = 10
# pad_capacitance_file = /chemin/vers/capacites.txt
enc_total         = 2000         # e- rms ; modele uniform seulement

# --- Reponse du preampli : choisir UN des deux blocs (l'autre reste commente) ---

# Bloc A : reponse de TEST (gaussienne). L'ENC est donnee par enc0, enc_ref et f_par/f_ser/f_can.
#preamp_response   = test_gauss
#preamp_gauss_fwhm = 190          # ns, largeur de la gaussienne de test
# enc0 = 1150                    # e- : ENC a C = 0 (valeur par defaut)
# enc_ref = 1400                 # e- : ENC a c_ref_pf (valeur par defaut)
#f_par             = 0.475        # fractions d'energie parallele / serie / CAN (normalisees en interne)
#f_ser             = 0.475
#f_can             = 0.05
# ghost_window_ns : 940 ns par defaut avec test_gauss (voir la section fantomes)

# Bloc B : reponse MINOS. L'ENC est calculee a partir du temps de pic (modele ENC(tp, C), enc_model.hpp).
# enc0, enc_ref, f_par, f_ser et f_can sont INTERDITS avec ce bloc (arret avec message d'erreur) :
# les commenter dans le bloc A. Avec noise_model = capacitance seulement.
preamp_response      = minos
preamp_minos_peak_ns = 388      # ns, temps du maximum de la reponse ; obligatoire, entre 76 et 919
# ghost_window_ns : absente = calculee automatiquement (queue de h + 2 marges + 100 ns)

adc_period_ns     = 20           # multiple entier de delta_t
read_thr_sigma    = 4            # seuil de lecture = read_thr_sigma * ENC de reference (enc_ref, ou ENC(tp, c_ref) avec minos) ; enc_total si uniform
read_n_consec     = 1            # echantillons consecutifs au-dessus du seuil
window_margin_ns  = 100          # marge de la fenetre ecrite, de chaque cote du signal vrai
noise_seed        = 12345        # graine du bruit : graine d'evenement = mix_seed(noise_seed, indice)

# --- Pads fantomes (seulement avec noise_enable = 1) : pads sans signal vrai dont le bruit franchit le seuil ---
ghost_enable       = 1           # 0 : pas de fantomes (les pads du signal sont identiques dans les deux cas)
ghost_prob         = -1          # < 0 : probabilite p par pad calibree au lancement ; >= 0 : valeur imposee
# ghost_window_ns = 940       # longueur de la fenetre ecrite d'un fantome ; absente : 940 ns (test_gauss) ou automatique (minos)
ghost_calib_trials = 20000       # tirages pour calibrer p (erreur ~ 1 %)

# --- Detecteur ---
dkg          = 20.0
dga          = 0.3
vertex_r_max = 1.0
Fano         = 0.2
W            = 26.0e-6   # MeV par paire

#P10
#DT_kg        = 0.06
#DT_ga        = 0.05
#DL_kg        = 0.035
#DL_ga        = 0.02
#ve_kg        = 0.0055
#ve_ga        = 0.002

#90%Ar + 10%CF4
DT_kg        = 0.02
DT_ga        = 0.04
DL_kg        = 0.012
DL_ga        = 0.016
ve_kg        = 0.010
ve_ga        = 0.003

#90%Ar + 5%CF4 + 5%CH4
#DT_kg        = 0.028
#DT_ga        = 0.043
#DL_kg        = 0.02
#DL_ga        = 0.02
#ve_kg        = 0.010
#ve_ga        = 0.003

delta_t      = 10.0

# --- Plan de pads 3mm + Anneaux---
#pad_size     = 0.3  
#inter_pad    = 0.015
#r_quinconce  = 8.1
#r_transition = 8.2
#r_active     = 10.0
#n_rings      = 6
#y_offset     = 0.0       # doit rester 0

# --- Plan de pads carres, sans anneau ---
pad_size     = 0.5  
inter_pad    = 0.015
r_quinconce  = 10
r_transition = 10
r_active     = 10.0
n_rings      = 0
y_offset     = 0.0       # doit rester 0

# --- Induction (ne pas changer sans connaissance) ---
reach_pitch  = 3      # portée de la table d'induction en pad (3 par défaut)
reach_tol    = 1e-5   # Perte de charge tolérée pour une table (voxel centrée sur le pad, table de portée reach_pitch
bound_margin = 1.3

# --- Table d'induction : 0 = calcul automatique a partir de la geometrie (conseille) ---
table_kappa    = 3        # grille u,v adaptative : pas(d) = sigma_anode(d) / kappa ; 0 = grille uniforme (table_step_out)
table_step_cap = 0        # adaptatif : plafond du pas (cm) ; 0 = pitch/8
table_step_out = 0        # pas des noeuds u,v (cm), grille uniforme seulement ; auto = min(pitch/16, gap/15)
table_m_cells  = 0        # cellules de la source phi par demi-pad ; auto = ceil(3.5 a / sigma_gap), sigma_gap = DT_ga sqrt(gap), 8 a 64
table_r_src    = 0        # rayon de la source phi (cm) ; auto = sqrt(2)*a + 6*gap
table_n_d      = 20       # noeuds en ln(sigma)
table_n_img    = 20       # images du potentiel de ponderation
max_table_mb   = 1000      # plafond memoire de la table (Mo)

table_acc_tol   = 1e-3    # tolerance du controle de la table (charge finale par pad et somme des pads) ; 0 = pas de controle

# --- Resolution en temps de la table (pas de table = delta_t / R) ---
table_R        = 0        # 0 = automatique : plus petit R <= 4 dont l'ecart a la reference est < table_tau_tol
table_tau_tol  = 0.005    # erreur relative toleree sur le signal (interpolation en tau) ; 0 = pas de controle, imposer table_R
table_tau_dmin = 2.0      # distance de derive minimale (cm) des voxels pour ce controle
table_tau_Rref = 12        # R de la table de reference du controle (>= 5) ; plus grand = reference plus exacte, plus lente

# --- Controles ---
# Un controle qui echoue ARRETE le programme avec un message explicite.
# Pour passer outre, lister ses identifiants (separes par des virgules), par exemple :
#   ignore = tau_resolution,phi_edge
# Identifiants : tau_resolution, n_h_small, step_out_coarse, reach_small, reach_loss
#                table_memory, ring_geometry, phi_edge
ignore =

# n_rings = 0 : pas d'anneaux, toute l'anode en pads carres jusqu'a r_quinconce
# (mettre alors r_quinconce = r_active ; les cellules au-dela sont perdues).