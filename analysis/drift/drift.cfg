# ===========================================================================
# Fichier d'input de ./process
#   usage :  ./process Drift.cfg [cle=valeur ...]
#   les arguments cle=valeur surchargent le fichier (utile pour les balayages)
#   unites : cm, ns, electrons
# ===========================================================================

# --- Fichiers (obligatoires) ---
input_file  = ../../../simulation_output/T2F_G4_40mu.h5
output_file = ../drift_output/drift_pad5mm.h5

# --- Execution ---
n_events    = 100000        # 0 = tous les evenements du fichier d'entree
n_threads   = 8        # 1 pour des tirages reproductibles d'une version a l'autre
chunk_size  = 20000
base_seed   = 42
frag_mask   = 3        # 3 = H et L, 1 = H seul, 2 = L seul
step_size_target = 0.05   # pas de trace apres fusion (cm)

# --- Lecture (seuils en electrons par bin) ---
# Pour tout lire (controles de conservation) : seuil_qt_pos = 0 et seuil_qt_neg = 0
seuil_qt_pos = 200
seuil_qt_neg = -200
eps_qt       = 10

# --- Detecteur ---
dkg          = 20.0
dga          = 0.3
vertex_r_max = 1.0
Fano         = 0.2
W            = 26.0e-6   # MeV par paire

#P10
#DT_kg        = 0.06
#DT_ga        = 0.05
#DL_kg        = 0.035
#DL_ga        = 0.02
#ve_kg        = 0.0055
#ve_ga        = 0.002

#90%Ar+10%CF4
DT_kg        = 0.02
DT_ga        = 0.04
DL_kg        = 0.012
DL_ga        = 0.016
ve_kg        = 0.010
ve_ga        = 0.003

delta_t      = 10.0

# --- Plan de pads 3mm + Anneaux---
#pad_size     = 0.3  
#inter_pad    = 0.015
#r_quinconce  = 8.1
#r_transition = 8.2
#r_active     = 10.0
#n_rings      = 6
#y_offset     = 0.0       # doit rester 0

# --- Plan de pads 4mm + Sans Anneau---
pad_size     = 0.5  
inter_pad    = 0.015
r_quinconce  = 10
r_transition = 10
r_active     = 10.0
n_rings      = 0
y_offset     = 0.0       # doit rester 0

# --- Induction (ne pas changer sans connaissance) ---
reach_pitch  = 3      # portée de la table d'induction en pad (3 par défaut)
reach_tol    = 1e-5   # Perte de charge tolérée pour une table (voxel centrée sur le pad, table de portée reach_pitch
bound_margin = 1.3

# --- Table d'induction : 0 = calcul automatique a partir de la geometrie (conseille) ---
table_kappa    = 3        # grille u,v adaptative : pas(d) = sigma_anode(d) / kappa ; 0 = grille uniforme (table_step_out)
table_step_cap = 0        # adaptatif : plafond du pas (cm) ; 0 = pitch/8
table_step_out = 0        # pas des noeuds u,v (cm), grille uniforme seulement ; auto = min(pitch/16, gap/15)
table_m_cells  = 0        # cellules de la source phi par demi-pad ; auto = ceil(3.5 a / sigma_gap), sigma_gap = DT_ga sqrt(gap), 8 a 64
table_r_src    = 0        # rayon de la source phi (cm) ; auto = sqrt(2)*a + 6*gap
table_n_d      = 20       # noeuds en ln(sigma)
table_n_img    = 20       # images du potentiel de ponderation
max_table_mb   = 1000      # plafond memoire de la table (Mo)

table_acc_tol   = 1e-3    # tolerance du controle de la table (charge finale par pad et somme des pads) ; 0 = pas de controle

# --- Resolution en temps de la table (pas de table = delta_t / R) ---
table_R        = 0        # 0 = automatique : plus petit R <= 4 dont l'ecart a la reference est < table_tau_tol
table_tau_tol  = 0.005    # erreur relative toleree sur le signal (interpolation en tau) ; 0 = pas de controle, imposer table_R
table_tau_dmin = 2.0      # distance de derive minimale (cm) des voxels pour ce controle
table_tau_Rref = 12        # R de la table de reference du controle (>= 5) ; plus grand = reference plus exacte, plus lente

# --- Controles ---
# Un controle qui echoue ARRETE le programme avec un message explicite.
# Pour passer outre, lister ses identifiants (separes par des virgules), par exemple :
#   ignore = tau_resolution,phi_edge
# Identifiants : tau_resolution, n_h_small, step_out_coarse, reach_small, reach_loss
#                table_memory, ring_geometry, phi_edge
ignore =

# n_rings = 0 : pas d'anneaux, toute l'anode en pads carres jusqu'a r_quinconce
# (mettre alors r_quinconce = r_active ; les cellules au-dela sont perdues).
