# ===========================================================================
# Fichier d'input de ./process
#   usage :  ./process Drift.cfg [cle=valeur ...]
#   les arguments cle=valeur surchargent le fichier (utile pour les balayages)
#   unites : cm, ns, electrons
# ===========================================================================

# --- Fichiers (obligatoires) ---
input_file  = ../../../simulation_output/T2F_G4_40mu.h5
output_file = ../drift_output/drift_4mm.h5

# --- Execution ---
n_events    = 1000        # 0 = tous les evenements du fichier d'entree
n_threads   = 8        # 1 pour des tirages reproductibles d'une version a l'autre
chunk_size  = 20000
base_seed   = 42
frag_mask   = 3        # 3 = H et L, 1 = H seul, 2 = L seul
step_size_target = 0.05   # pas de trace apres fusion (cm)

# --- Lecture (seuils en electrons par bin) ---
# Pour tout lire (controles de conservation) : seuil_qt_pos = 0 et seuil_qt_neg = 0
seuil_qt_pos = 200
seuil_qt_neg = -200
eps_qt       = 10

# --- Detecteur ---
dkg          = 20.0
dga          = 0.3
vertex_r_max = 1.0
Fano         = 0.2
W            = 26.0e-6   # MeV par paire
DT_kg        = 0.06
DT_ga        = 0.05
DL_kg        = 0.035
DL_ga        = 0.02
ve_kg        = 0.0055
ve_ga        = 0.002
delta_t      = 10.0

# --- Plan de pads ---
pad_size     = 0.4
inter_pad    = 0.015
r_quinconce  = 10
r_transition = 10
r_active     = 10.0
n_rings      = 0
y_offset     = 0.0       # doit rester 0

# --- Induction (ne pas changer sans connaissance) ---
reach_pitch  = 4.5
bound_margin = 1.3

# --- Table d'induction : 0 = calcul automatique a partir de la geometrie (conseille) ---
table_step_out = 0        # pas des noeuds u,v (cm) ; auto = min(pitch/16, gap/15)
table_m_cells  = 0        # resolution de la source phi ; auto = max(8, 15*a/gap)
table_r_src    = 2.5      # rayon de la source phi (cm) ; auto = sqrt(2)*a + 5*gap
table_n_d      = 10       # noeuds en ln(sigma)
table_n_img    = 10       # images du potentiel de ponderation
max_table_mb   = 500      # plafond memoire de la table (Mo)

# --- Controles ---
# Un controle qui echoue ARRETE le programme avec un message explicite.
# Pour passer outre, lister ses identifiants (separes par des virgules), par exemple :
#   ignore = T_gap_non_multiple,phi_edge
# Identifiants : T_gap_non_multiple, n_h_small, step_out_coarse, reach_small,
#                table_memory, ring_geometry, phi_edge
ignore =

# n_rings = 0 : pas d'anneaux, toute l'anode en pads carres jusqu'a r_quinconce
# (mettre alors r_quinconce = r_active ; les cellules au-dela sont perdues).
